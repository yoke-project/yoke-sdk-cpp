# A release's tag runs this repository's release verb where the tag is seen. The verb's lines are the
# run's output the release command collects; it appends them to the manifest itself.
name: release

on:
  push:
    tags: ['v*']

# The verb hands the source archive to the tag's release: nothing else is published, and nothing stored.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The verb reads which tags name this commit, and archives the tagged tree.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: just release > manifest-lines.jsonl
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-lines
          path: manifest-lines.jsonl
